<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обнимаю тебя</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    color: white;
    padding: 20px;
  }

  .stars { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; overflow: hidden; }
  .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.9; transform: scale(1.3); } }

  .container { text-align: center; z-index: 10; padding: 20px; max-width: 500px; }

  h1 { font-size: 2em; margin-bottom: 10px; font-weight: 300; letter-spacing: 1px; text-shadow: 0 2px 20px rgba(255, 255, 255, 0.3); }

  .subtitle { color: rgba(255, 255, 255, 0.7); margin-bottom: 40px; font-size: 0.95em; line-height: 1.5; }

  .hug-btn {
    position: relative; width: 180px; height: 180px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 30% 30%, #ff9a9e, #f5576c, #c0392b);
    box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7), 0 10px 40px rgba(245, 87, 108, 0.5), inset 0 -10px 20px rgba(0, 0, 0, 0.2), inset 0 10px 20px rgba(255, 255, 255, 0.3);
    font-size: 1.2em; color: white; font-family: inherit; transition: transform 0.2s ease; animation: pulse 2.5s infinite; z-index: 10;
  }
  .hug-btn:hover { transform: scale(1.08); }
  .hug-btn:active { transform: scale(0.95); }
  .hug-btn span { display: block; font-size: 2.5em; margin-bottom: 5px; }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7), 0 10px 40px rgba(245, 87, 108, 0.5), inset 0 -10px 20px rgba(0, 0, 0, 0.2), inset 0 10px 20px rgba(255, 255, 255, 0.3); }
    50% { box-shadow: 0 0 0 25px rgba(245, 87, 108, 0), 0 10px 50px rgba(245, 87, 108, 0.8), inset 0 -10px 20px rgba(0, 0, 0, 0.2), inset 0 10px 20px rgba(255, 255, 255, 0.3); }
  }

  .message { margin-top: 30px; font-size: 1.2em; opacity: 0; transform: translateY(20px); transition: all 0.6s ease; min-height: 40px; text-shadow: 0 2px 15px rgba(255, 255, 255, 0.5); }
  .message.show { opacity: 1; transform: translateY(0); }

  .counter { margin-top: 20px; font-size: 1.1em; color: rgba(255, 255, 255, 0.85); min-height: 24px; transition: all 0.3s ease; font-weight: 500; }

  .heart { position: fixed; font-size: 2em; pointer-events: none; z-index: 100; animation: flyUp 2.5s ease-out forwards; }
  @keyframes flyUp { 0% { opacity: 1; transform: translate(0, 0) scale(0.5) rotate(0deg); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.5) rotate(var(--r)); } }

  .secret-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 30px; animation: fadeIn 0.5s ease; }
  .secret-overlay.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .secret-content { max-width: 500px; text-align: center; background: linear-gradient(135deg, #f093fb, #f5576c); padding: 40px 30px; border-radius: 24px; box-shadow: 0 20px 60px rgba(240, 147, 251, 0.5); animation: pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes pop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .secret-content h2 { font-size: 2em; margin-bottom: 15px; color: white; }
  .secret-content p { font-size: 1.1em; line-height: 1.6; color: white; margin-bottom: 15px; }
  .secret-content .big-heart { font-size: 5em; display: block; margin-bottom: 15px; animation: beat 1s infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

  .secret-close { margin-top: 20px; padding: 12px 30px; border: none; border-radius: 12px; background: rgba(255, 255, 255, 0.2); color: white; font-size: 1em; cursor: pointer; font-family: inherit; transition: background 0.3s; }
  .secret-close:hover { background: rgba(255, 255, 255, 0.35); }

  .confetti { position: fixed; font-size: 1.5em; pointer-events: none; z-index: 1100; animation: confettiFall 3s ease-in forwards; }
  @keyframes confettiFall { 0% { opacity: 1; transform: translateY(0) rotate(0deg); } 100% { opacity: 0; transform: translateY(100vh) rotate(720deg); } }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <h1>Обнимаю тебя</h1>
  <p class="subtitle">Нажми на кнопку — и объятие улетит к ней</p>

  <button class="hug-btn" onclick="sendHug()">
    <span>🤗</span>
    Обнять
  </button>

  <div class="message" id="message"></div>
  <p class="counter" id="counter"></p>
</div>

<div class="secret-overlay" id="secretOverlay">
  <div class="secret-content">
    <span class="big-heart">💖</span>
    <h2>Ты нашёл пасхалку!</h2>
    <p>10 нажатий подряд — и вот что я хочу тебе сказать:</p>
    <p><strong>Ты — моё самое любимое чудо. Спасибо, что ты есть. Каждый день с тобой — подарок. 💕</strong></p>
    <p style="font-size: 0.9em; opacity: 0.8;">(и тебе только что прилетело секретное сообщение в Telegram)</p>
    <button class="secret-close" onclick="closeSecret()">Обнимаю в ответ 🤗</button>
  </div>
</div>

<script>
  // === НАСТРОЙКИ ===
  const BOT_TOKEN = "8843829221:AAHZsGftQKQl3tlHtFTLnXRNzMCRCc5roMA";
  const MY_CHAT_ID = "96637831";
  const GRISHA_CHAT_ID = "337923334";
  const MY_NAME = "Гриша";
  // =================

  const messages = [
    '🤗 Обнимаю тебя крепко-крепко',
    '💕 Обнимаю нежно-нежно',
    '🐻 Обнимаю как медведь',
    '💫 Обнимаю через все расстояния',
    '💛 Скучаю и обнимаю',
    '🌟 Обнимаю так, что не отпущу',
    '✨ Просто обнимаю. Без повода',
    '💖 Обнимаю тебя прямо сейчас',
    '🌸 Обнимаю тепло-тепло',
    '🫂 Обнимаю до самого утра'
  ];

  const SECRET_TEXT = `🎁 СЕКРЕТНОЕ ОБЪЯТИЕ ОТ ГРИШИ!\n\n10 нажатий подряд — и вот что я хочу тебе сказать:\n\nТы — моё самое любимое чудо. Спасибо, что ты есть. Каждый день с тобой — подарок. 💕\n\nОбнимаю тебя так крепко, что никакие расстояния не помешают.`;

  async function sendToTelegram(text) {
    const chatIds = [MY_CHAT_ID, GRISHA_CHAT_ID];
    for (const chatId of chatIds) {
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: chatId, text: text })
        });
      } catch (e) {
        console.log('Ошибка отправки для', chatId, e);
      }
    }
  }

  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    starsContainer.appendChild(star);
  }

  function getCount() {
    return parseInt(localStorage.getItem('hug_count_grisha') || '0', 10);
  }
  function incrementCount() {
    const newCount = getCount() + 1;
    localStorage.setItem('hug_count_grisha', newCount);
    return newCount;
  }
  function updateCounterDisplay(count) {
    const counterEl = document.getElementById('counter');
    if (counterEl) {
      if (count === 0) counterEl.textContent = `Ты ещё не обнял ни разу. Нажми! 🤗`;
      else counterEl.textContent = `Ты обнял уже ${count} раз 💕`;
    }
  }

  function getStreak() {
    const last = parseInt(localStorage.getItem('hug_streak_time_grisha') || '0', 10);
    const now = Date.now();
    if (now - last > 3000) return 0;
    return parseInt(localStorage.getItem('hug_streak_grisha') || '0', 10);
  }
  function updateStreak() {
    const current = getStreak() + 1;
    localStorage.setItem('hug_streak_grisha', current);
    localStorage.setItem('hug_streak_time_grisha', Date.now());
    return current;
  }
  function resetStreak() {
    localStorage.setItem('hug_streak_grisha', 0);
    localStorage.setItem('hug_streak_time_grisha', 0);
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateCounterDisplay(getCount());
  });

  async function sendHug() {
    const msg = document.getElementById('message');
    const chosenMessage = messages[Math.floor(Math.random() * messages.length)];
    msg.textContent = chosenMessage;
    msg.classList.add('show');

    for (let i = 0; i < 15; i++) createHeart();
    if (navigator.vibrate) navigator.vibrate([50, 30, 50]);

    const newCount = incrementCount();
    updateCounterDisplay(newCount);

    const streak = updateStreak();

    if (streak >= 10) {
      resetStreak();
      showSecret();
      await sendToTelegram(SECRET_TEXT);
      return;
    }

    const textWithCount = `${MY_NAME}: ${chosenMessage}\n📊 Ты обняла уже ${newCount} раз(а)`;
    await sendToTelegram(textWithCount);
  }

  function showSecret() {
    document.getElementById('secretOverlay').classList.add('active');
    for (let i = 0; i < 50; i++) {
      setTimeout(() => createConfetti(), i * 30);
    }
    if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
  }

  function closeSecret() {
    document.getElementById('secretOverlay').classList.remove('active');
  }

  function createConfetti() {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = ['💖','💕','💗','✨','🌟','💛','🎉','🌸'][Math.floor(Math.random()*8)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-50px';
    el.style.fontSize = (Math.random() * 1.5 + 1) + 'em';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = ['💖','💕','💗','💛','🤗','✨'][Math.floor(Math.random()*6)];

    const btn = document.querySelector('.hug-btn');
    const rect = btn.getBoundingClientRect();
    heart.style.left = (rect.left + rect.width/2) + 'px';
    heart.style.top = (rect.top + rect.height/2) + 'px';

    const angle = Math.random() * Math.PI * 2;
    const distance = Math.random() * 300 + 150;
    heart.style.setProperty('--x', Math.cos(angle) * distance + 'px');
    heart.style.setProperty('--y', (Math.sin(angle) * distance - 200) + 'px');
    heart.style.setProperty('--r', (Math.random() - 0.5) * 720 + 'deg');

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 2600);
  }
</script>
</body>
</html>
